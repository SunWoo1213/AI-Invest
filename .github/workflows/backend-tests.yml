name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # LLM · 외부 API는 테스트에서 모킹한다. 실제 키 없이 돈다.
      - run: python -m pytest -q -rs -p no:cacheprovider
        env:
          # CI 전용 더미 값(비밀 아님). .env 없이 필수 설정만 채운다.
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          PROJECT_NAME: ci
          API_V1_STR: /api/v1
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
